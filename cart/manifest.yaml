apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: backend
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
 

apiVersion: v1 
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: cart
      tier: backend
  templates:
    metadata:
      labels:
        project: roboshop
        component: cart
        tier: backend
    spec:
     containers:
     - name: cart
       image: srinunaik208/cart:v1 
       envFrom:
       - configMapRef:
           name: cart

---
apiVersion: v1 
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    tier: backend
spec:
  selector:
    project: roboshop
    component: cart
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080
      
