apiVersion: v1 
kind: Deployment
metadata: 
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  replicas: 2
  selector:
    matchLebels:
       project: roboshop
       component: redis
       tier: database
  templates:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: database
    spec:
      containers:
        - name: redis 
          image: redis:7.0
---
apiVersion: v1 
kind: Service
metadata:
  name: redis
  labels:
     project: roboshop
     component: redis
     tier: database
spec:
  selector:
    project: roboshop
    component: redis
    tier: database
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
    
