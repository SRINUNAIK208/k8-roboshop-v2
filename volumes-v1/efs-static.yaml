apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static 
spec:
  volumeMode: fileSystem
  accesModes:
  - ReadWriteMany
  capacity:
    storage: 5Gi 
  csi:
   driver: efs.csi.aws.com
   volumeHandle: 
---
apiVersion: v1 
kind: PersistantVoulmeClaim
metadata:
  name: efs-static
spec:
 voulmeName: efs-static 
 accesModes:
 - ReadWriteMany
 resources:
  requests:
    storage: 20Gi 
---
apiVersion: v1 
kind: Pod 
metadata: 
  name: nginx
spec:
 containers:
 - name: nginx
   image: nginx
   volumeMounts:
   - name: efs-storage
     mountPath: /usr/share/nginx/html
 volumes:
 - name: efs-storage
   persistentVolumeClaim: 
     claimName: efs-static


