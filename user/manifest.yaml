apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    tier: backend
data:
  MONGO: "true" 
  REDIS_URL: 'redis://redis:6379' 
  MONGO_URL: "mongodb://mongodb:27017/users"
---
 

apiVersion: v1 
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: user
      tier: backend
  templates:
    metadata:
      labels:
        project: roboshop
        component: user
        tier: backend
    spec:
     containers:
     - name: user
       image: srinunaik208/user:v1 
       envFrom:
       - configMapRef:
           name: user

---
apiVersion: v1 
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    tier: backend
spec:
  selector:
    project: roboshop
    component: user
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080
      
