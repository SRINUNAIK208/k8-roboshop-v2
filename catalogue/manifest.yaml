apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    tier: backend
data:
  MONGO: "true" 
  MONGO_URL: "catalogue://catalogue:27017/catalogue"
---
 

apiVersion: v1 
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: catalogue
      tier: backend
  templates:
    metadata:
      labels:
        project: roboshop
        component: catalogue
        tier: backend
    spec:
     containers:
     - name: catalogue
       image: srinunaik208/catalogue:v1 
       envFrom:
       - configMapRef:
           name: catalogue

---
apiVersion: v1 
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    tier: backend
spec:
  selector:
    project: roboshop
    component: catalogue
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080
      
