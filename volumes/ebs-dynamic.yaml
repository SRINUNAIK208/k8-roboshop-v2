apiVersion: storage.io/
kind: storageClass
metadata:
  name: ebs-dynamic
provisioner: ebs.csi.aws.com
volumeBindingMode: waitForFirstConsumer
---
apiVersion: v1 
kind: PersistantVoulmeClaim
metadata:
  name: ebs-dynamic
spec:
  storageClass: ebs-dynamic
  accessMode:
  - readwriteOnce
---
apiVersion: apps/v1 
kind: Deployment
metadata:
 name: nginx
 labels:
   purpose: demo
   component: nginx
spec:
 replicas: 1
 selector:
   matchLabels:
    purpose: demo
    component: nginx
 template:
   metadata:
     labels:
      purpose: demo
      component: nginx
   spec:
     containers:
      - name: nginx
        image: nginx
        volumeMount:
        - name: ebs-dynamic
          mountPath: /usr/share/nginx/html
     volumes:
       name: persistant-storage
       PersistantVoulmeClaim:
            claimName: ebs-dynamic
---
apiVersion: v1 
kind: Service 
metadata:
  name: nginx-svc 
spec:
  selector:
    purpose: demo
    component: nginx
  ports:
  - protocol: TCP 
    port: 80 
    targetPort: 8080
 

  
  

